# Render cấp cổng qua biến môi trường PORT; Apache tự thay ${PORT} lúc khởi động.
<VirtualHost *:${PORT}>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        # Cho phép public/.htaccess của Laravel hoạt động (định tuyến qua index.php)
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Chặn truy cập mọi file ẩn (.env, .git, ...) nếu chẳng may lọt vào public/
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <Files ".htaccess">
        Require all denied
    </Files>

    # Nhật ký đổ ra stdout/stderr để xem trong tab Logs của Render.
    # Bỏ qua nhật ký của health check (Render gọi vài giây một lần) cho đỡ rối.
    SetEnvIf Request_URI "^/api/healthz$" dontlog
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!dontlog
</VirtualHost>

# Không để lộ phiên bản Apache/hệ điều hành
ServerTokens Prod
ServerSignature Off

# Render gói miễn phí chỉ có 512MB RAM: giới hạn số tiến trình Apache để
# không bị hệ điều hành giết vì hết bộ nhớ khi có nhiều người vào cùng lúc.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        12
    MaxConnectionsPerChild   500
</IfModule>
