; Cấu hình PHP riêng của ToyLand (nạp sau php.ini-production)

; Ảnh sản phẩm tối đa 5MB/ảnh (ImageUploadService::MAX_KILOBYTES),
; form sản phẩm có thể gửi kèm nhiều ảnh thư viện một lượt.
upload_max_filesize = 8M
post_max_size = 48M
max_file_uploads = 20

; Render gói miễn phí có 512MB RAM
memory_limit = 256M
max_execution_time = 60

; Không để lộ phiên bản PHP trong header phản hồi
expose_php = Off

; Múi giờ trùng với config/app.php
date.timezone = Asia/Ho_Chi_Minh

; OPcache: mã nguồn trong container không đổi, chỉ cần kiểm tra lại thưa thớt
opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
